services:

  # ─── Data Lake ────────────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"   # API S3
      - "9001:9001"   # Console Web
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ─── Base de données ──────────────────────────────────────────────
  postgres:
    image: timescale/timescaledb:latest-pg15
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Broker / Cache ───────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Django (UI + API REST) tourne sur la machine hôte — voir README.

  # ─── Migrations (one-shot, lancé avant les workers) ──────────────
  migrate:
    build: .
    command: python manage.py migrate --no-input
    volumes:
      - .:/app
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: http://minio:9000
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # ─── Celery Worker Bronze (collecte externe, I/O réseau) ─────────
  celery-worker-bronze:
    build: .
    command: celery -A urbanhub worker -l info -n bronze@%h -Q bronze,default -c 4
    volumes:
      - .:/app
    env_file: .env
    environment:
      # Surcharge du .env (localhost) : dans le réseau Docker les services s'appellent ainsi
      POSTGRES_HOST: postgres
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: http://minio:9000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # ─── Celery Worker Silver (normalisation / parquet traité) ───────
  celery-worker-silver:
    build: .
    command: celery -A urbanhub worker -l info -n silver@%h -Q silver -c 2
    volumes:
      - .:/app
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: http://minio:9000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # ─── Celery Worker Postgres (upserts / batch DB) ─────────────────
  celery-worker-postgres:
    build: .
    command: celery -A urbanhub worker -l info -n postgres@%h -Q ingestion_postgres -c 1
    volumes:
      - .:/app
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: http://minio:9000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # ─── Celery Worker Gold (agrégats dashboard) ─────────────────────
  celery-worker-gold:
    build: .
    command: celery -A urbanhub worker -l info -n gold@%h -Q gold -c 1
    volumes:
      - .:/app
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: http://minio:9000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # ─── Celery Worker Analysis (analyses croisées) ──────────────────
  celery-worker-analysis:
    build: .
    command: celery -A urbanhub worker -l info -n analysis@%h -Q analysis -c 1
    volumes:
      - .:/app
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: http://minio:9000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # ─── Celery Beat (scheduling batch & IoT) ────────────────────────
  celery-beat:
    build: .
    command: celery -A urbanhub beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - .:/app
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: http://minio:9000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # ─── Monitoring PostgreSQL ───────────────────────────────────────
  pgweb:
    image: sosedoff/pgweb:latest
    command: >
      pgweb
      --bind=0.0.0.0
      --listen=8081
      --url=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ─── Monitoring Celery ────────────────────────────────────────────
  flower:
    build: .
    command: celery -A urbanhub flower --port=5555
    ports:
      - "5555:5555"
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: http://minio:9000
    depends_on:
      - redis

  # ─── Jupyter Lab ─────────────────────────────────────────────────
  jupyter:
    build: .
    command: >
      jupyter lab
      --ip=0.0.0.0
      --port=8888
      --no-browser
      --allow-root
      --ServerApp.token=''
      --ServerApp.password=''
      --notebook-dir=/app/notebooks
    volumes:
      - .:/app
    ports:
      - "8888:8888"
    env_file: .env
    environment:
      MPLCONFIGDIR: /tmp/matplotlib
      XDG_CACHE_HOME: /tmp/.cache
      POSTGRES_HOST: postgres
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: http://minio:9000
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
